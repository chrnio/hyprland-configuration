general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# Dim the backlight half a minute early so the lock never arrives unannounced
listener {
    timeout = 570
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock at 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off shortly after. The sleep stops dpms from racing hyprlock while it
# is still starting up, which can otherwise wedge the session.
listener {
    timeout = 630
    on-timeout = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Suspend at 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
